<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>FUN60 MAX</title>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="/js/main.js">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='14' rx='4' fill='none' stroke='%23888' stroke-width='2'/%3E%3Crect x='8' y='14' width='16' height='3' rx='1.5' fill='%23888'/%3E%3C/svg%3E">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-side">
    <span class="brand"><b>FUN60</b><span>MAX</span></span>
  </div>
  <nav id="tabs" class="bar-center" aria-label="Sections"></nav>
  <div class="bar-side end">
    <button id="status" class="pill" type="button" hidden title="Disconnect">
      <i class="bat"><i></i></i><span id="status-text"></span>
    </button>
    <button id="lang" class="icon-btn" type="button" aria-label="Language"></button>
    <button id="theme" class="icon-btn" type="button" aria-label="Theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle class="sun" cx="12" cy="12" r="4.5"/>
        <g class="rays"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g>
      </svg>
    </button>
  </div>
  <i class="progress" aria-hidden="true"></i>
</header>

<main class="stage">
  <section class="hero">
    <div class="hero-inner">
      <h1 id="hero-title"></h1>
      <p id="hero-body"></p>
      <button id="connect" class="btn primary large" type="button"></button>
      <p id="hero-error" class="hero-error" hidden></p>
    </div>
  </section>
  <div class="board"><div class="case"><div id="kb" class="kb"></div></div></div>
  <div class="view">
    <div class="strip">
      <div id="strip-l" class="strip-side"></div>
      <div id="toolbar" class="toolbar"></div>
      <div id="strip-r" class="strip-side end"></div>
    </div>
    <div id="panel" class="panel"></div>
  </div>
</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
